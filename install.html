<!DOCTYPE html>

<html>
    <head>
        <title>recko.dev</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/x-icon" href="/assets/icon.ico">

        <link rel="preload" href="/assets/title.png" as="image"/>
        <link rel="preload" href="/assets/button.png" as="image"/>
        <link rel="preload" href="/assets/button_hover.png" as="image"/>
        <link rel="preload" href="sfx/click.ogg" as="audio"/>
    </head>

    <body>
        <div style="text-align: left; margin-top: 12.5vh; font-size: 3vmin; width: 50vw; margin-left: 25vw;">
            <h3>
                Mod installation
            </h3>
            <ul>
                <li>Download MultiMC or a fork of it</li>
                <li>Create an instance for the version Alpha 1.2.6</li>
                <li>Edit the instance</li>
                <li>Navigate to the version section</li>
                <li>Click "Add to Minecraft Jar"</li>
                <li>Select the zip file you downloaded</li>
                <li>Have fun!</li>
            </ul> 
        </div>
        
        <br>
        
        <a href="home.html" target="page">
            <button onclick="window.parent.document.getElementById('click').play();"
            style="position: fixed; bottom: calc(var(--button-width, 500px) / 40); left: calc(50vw - calc(var(--button-width, 500px) / 2))">
                Done
        </button></a>
    </body>
</html>
